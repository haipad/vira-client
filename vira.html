<!DOCTYPE html>
<html>
<head><title>vira audio</title></head>
<body>
<audio id="vira-output" autoplay playsinline></audio>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.23.2.js"></script>
<script>
const BACKEND = new URLSearchParams(location.search).get("backend") || "http://127.0.0.1:8000";

const HEADERS = { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" };

const CLIENT_ID = new URLSearchParams(location.search).get("client_id") || "";
const ACCESS_ID = new URLSearchParams(location.search).get("access_id") || "vira-desktop";
const USER_NAME = new URLSearchParams(location.search).get("user_name") || "User";
let lastAvatarState = "";
let agoraMicTrack = null;

async function playFallbackSpeech(text) {
  if (!text) return;
  try {
    const response = await fetch(`${BACKEND}/tts/synthesize`, {
      method: "POST",
      headers: HEADERS,
      body: JSON.stringify({ text }),
    });
    if (!response.ok) throw new Error(`TTS failed: ${await response.text()}`);
    const { audio } = await response.json();
    const bytes = atob(audio);
    const wav = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) wav[i] = bytes.charCodeAt(i);
    const blob = new Blob([wav], { type: "audio/wav" });
    const output = document.getElementById("vira-output");
    output.src = URL.createObjectURL(blob);
    output.muted = false;
    output.volume = 1;
    await output.play();
    console.log("vira fallback TTS playing:", text);
  } catch (error) {
    console.error("vira fallback TTS failed:", error);
  }
}

window.playFallbackSpeech = playFallbackSpeech;

function setAvatarState(state) {
  if (state === lastAvatarState) return;
  lastAvatarState = state;
  if (!CLIENT_ID) return;
  fetch(`${BACKEND}/desktop/state?client_id=${encodeURIComponent(CLIENT_ID)}&state=${encodeURIComponent(state)}`, {
    method: "POST",
  }).catch((error) => console.error("avatar state failed:", error));
}

async function init() {
  const params = new URLSearchParams(location.search);
  const cfg = {
    app_id: params.get("app_id"),
    channel_name: params.get("channel"),
    uid: params.get("uid"),
    agent_uid: params.get("agent_uid"),
    token: params.get("token"),
  };
  if (!cfg.app_id || !cfg.channel_name || !cfg.uid || !cfg.token) {
    throw new Error("Missing client-generated Agora RTC configuration");
  }

  const client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });

  client.on("user-published", async (user, mediaType) => {
    await client.subscribe(user, mediaType);
    if (mediaType === "audio") {
      user.audioTrack.setVolume(100);
      await user.audioTrack.play("vira-output");

      try {
        const playbackDevices = await AgoraRTC.getPlaybackDevices();
        const playbackDetails = playbackDevices.map((device) => ({ label: device.label, deviceId: device.deviceId }));
        console.log("vira playback devices:", playbackDetails);
        const senarySpeaker = playbackDevices.find((device) => /senary|speaker|headphone/i.test(device.label));
        const speaker = senarySpeaker || playbackDevices[0];
        if (speaker?.deviceId) {
          await user.audioTrack.setPlaybackDevice(speaker.deviceId);
          console.log("vira playback device selected:", speaker.label, speaker.deviceId);
        }
      } catch (playbackError) {
        console.warn("vira playback device selection failed:", playbackError);
      }

      const output = document.getElementById("vira-output");
      output.muted = false;
      output.volume = 1;
      await output.play().catch((error) => console.warn("vira output play retry needed:", error));
      console.log("vira agent audio playing:", output.currentTime, output.paused, output.muted);
    }
  });


  console.log("vira join config:", {
    app_id: cfg.app_id,
    channel_name: cfg.channel_name,
    uid: parseInt(cfg.uid),
    agent_uid: cfg.agent_uid,
    token_present: Boolean(cfg.token),
  });
  await client.join(cfg.app_id, cfg.channel_name, cfg.token, parseInt(cfg.uid));

  const playbackContext = new (window.AudioContext || window.webkitAudioContext)();
  await playbackContext.resume().catch(() => {});
  const toneGain = playbackContext.createGain();
  const oscillator = playbackContext.createOscillator();
  oscillator.frequency.value = 440;
  toneGain.gain.value = 0.15;
  oscillator.connect(toneGain);
  toneGain.connect(playbackContext.destination);
  oscillator.start();
  setTimeout(() => oscillator.stop(), 300);
  console.log("vira startup tone:", playbackContext.state);

  client.enableAudioVolumeIndicator({
    interval: 200,
    smooth: 3,
    reportSelfVolume: true,
  });

  client.on("volume-indicator", (result) => {
    const volumeDetails = result.map((speaker) => ({ uid: speaker.uid, volume: speaker.level ?? speaker.volume }));
    console.log("vira volume result:", JSON.stringify(volumeDetails));
    let localSpeaking = false;
    let agentSpeaking = false;

    for (const speaker of result) {
      const uid = String(speaker.uid);
      const speakerVolume = speaker.level ?? speaker.volume ?? 0;
      if (uid === String(cfg.uid) && speakerVolume > 8) localSpeaking = true;
      if (uid === String(cfg.agent_uid) && speakerVolume > 8) agentSpeaking = true;
    }

    if (agentSpeaking) {
      const agentResult = result.find((speaker) => String(speaker.uid) === String(cfg.agent_uid));
      console.log("vira agent volume:", agentResult?.level ?? agentResult?.volume);
      fetch(`${BACKEND}/desktop/audio/log`, {
        method: "POST",
        headers: HEADERS,
        body: JSON.stringify({ event: "agent_volume", client_id: CLIENT_ID, uid: cfg.agent_uid, volume: agentResult?.level ?? agentResult?.volume }),
      }).catch(() => {});
    }

    if (localSpeaking) {
      const localResult = result.find((speaker) => String(speaker.uid) === String(cfg.uid));
      console.log("vira local mic volume:", localResult?.level ?? localResult?.volume);
    }

    if (agentSpeaking) setAvatarState("speaking");
    else if (localSpeaking) setAvatarState("listening");
    else setAvatarState("idle");
  });

  if (!navigator.mediaDevices?.enumerateDevices || !navigator.mediaDevices?.getUserMedia) {
    throw new Error("Browser mediaDevices API is unavailable");
  }

  const devices = await navigator.mediaDevices.enumerateDevices();
  const inputDevices = devices.filter((device) => device.kind === "audioinput");
  const inputDetails = inputDevices.map((device) => ({ label: device.label, deviceId: device.deviceId }));
  console.log("vira audio inputs:", inputDetails);
  fetch(`${BACKEND}/desktop/audio/log`, {
    method: "POST",
    headers: HEADERS,
    body: JSON.stringify({ event: "audio_inputs", client_id: CLIENT_ID, inputs: inputDetails }),
  }).catch(() => {});

  const senaryMic = inputDevices.find((device) => /senary|microphone/i.test(device.label));
  const audioConstraints = senaryMic?.deviceId
    ? { deviceId: { exact: senaryMic.deviceId }, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    : { echoCancellation: true, noiseSuppression: true, autoGainControl: true };

  let mediaStream;
  try {
    fetch(`${BACKEND}/desktop/audio/log`, {
      method: "POST",
      headers: HEADERS,
      body: JSON.stringify({ event: "capture_started", client_id: CLIENT_ID }),
    }).catch(() => {});

    const capturePromise = navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false });
    const timeoutPromise = new Promise((_, reject) => {
      setTimeout(() => reject(new Error("Microphone getUserMedia timed out after 15 seconds")), 15000);
    });
    mediaStream = await Promise.race([capturePromise, timeoutPromise]);
  } catch (captureError) {
    const errorDetails = { event: "capture_failed", client_id: CLIENT_ID, name: captureError.name, message: captureError.message };
    console.error("vira capture failure:", errorDetails);
    fetch(`${BACKEND}/desktop/audio/log`, {
      method: "POST",
      headers: HEADERS,
      body: JSON.stringify(errorDetails),
    }).catch(() => {});
    throw new Error(`Microphone getUserMedia failed: ${captureError.name}: ${captureError.message}`);
  }

  const micTrack = mediaStream.getAudioTracks()[0];
  if (!micTrack) throw new Error("getUserMedia returned no audio track");
  console.log("vira captured mic:", micTrack.label, micTrack.readyState, micTrack.enabled);
  fetch(`${BACKEND}/desktop/audio/log`, {
    method: "POST",
    headers: HEADERS,
    body: JSON.stringify({ event: "capture_succeeded", client_id: CLIENT_ID, label: micTrack.label, readyState: micTrack.readyState, enabled: micTrack.enabled }),
  }).catch(() => {});

  agoraMicTrack = await AgoraRTC.createCustomAudioTrack({ mediaStreamTrack: micTrack });
  agoraMicTrack.setEnabled(true);
  agoraMicTrack.setVolume(100);
  await agoraMicTrack.setMuted(false);
  await client.publish(agoraMicTrack);
  console.log("vira microphone published:", cfg.uid, "label:", micTrack?.label, "state:", micTrack?.readyState, "enabled:", micTrack?.enabled);
  setAvatarState("idle");

  console.log("vira audio ready — channel:", cfg.channel_name);
}

init().catch((error) => {
  console.error("vira init failed:", error);
  setAvatarState("idle");
});
</script>
</body>
</html>
